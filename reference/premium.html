(()=>{const root=document.getElementById('mx-demo'),q=s=>root.querySelector(s),content=q('#mx-content');let view='overview',filter='Todos',search='',board=false;const tickets=[{id:1048,title:'Terminal de cobro sin conexión',client:'Farmacias Benavides',branch:'MTY · Sucursal 0241',priority:'Crítica',status:'Abierto',agent:'Ana López',channel:'Teléfono',sla:'18 min',desc:'La terminal de cobro perdió conexión. La sucursal no puede procesar pagos con tarjeta.',history:['09:12 · Ticket registrado desde llamada','09:15 · Ana López asignada al caso']},{id:1047,title:'Solicitud de mantenimiento preventivo',client:'Martí',branch:'CDMX · Plaza Universidad',priority:'Media',status:'En proceso',agent:'Carlos Ruiz',channel:'Email',sla:'3 h 20 min',desc:'Se solicita programar una revisión preventiva de los equipos de la sucursal.',history:['08:45 · Solicitud recibida por email','09:10 · Visita en coordinación']},{id:1046,title:'Acceso bloqueado al sistema de inventario',client:'Farmacias Benavides',branch:'GDL · Sucursal 0318',priority:'Alta',status:'En proceso',agent:'Laura Méndez',channel:'Portal',sla:'52 min',desc:'El responsable de la sucursal no puede iniciar sesión en el sistema de inventario.',history:['08:30 · Ticket creado desde portal','08:42 · Identidad del solicitante verificada']},{id:1045,title:'Actualización de datos de contacto',client:'Martí',branch:'Puebla · Angelópolis',priority:'Baja',status:'Resuelto',agent:'Ana López',channel:'Email',sla:'Cumplido',desc:'Actualizar el contacto operativo de la sucursal.',history:['08:10 · Cambio solicitado','08:28 · Datos actualizados y confirmados']},{id:1044,title:'Impresora de etiquetas fuera de servicio',client:'Farmacias Benavides',branch:'CDMX · Sucursal 0112',priority:'Alta',status:'Pendiente',agent:'Carlos Ruiz',channel:'WhatsApp',sla:'1 h 12 min',desc:'La impresora muestra un error al emitir etiquetas. Se espera confirmación del modelo del equipo.',history:['07:50 · Incidencia registrada','08:15 · Se solicitó modelo y fotografía del error']},{id:1043,title:'Validación de cierre de servicio',client:'Martí',branch:'MTY · Galerías',priority:'Baja',status:'Cerrado',agent:'Laura Méndez',channel:'Portal',sla:'Cumplido',desc:'El cliente confirmó que el servicio quedó restablecido.',history:['Ayer · Solución aplicada','Hoy · Cierre confirmado por el cliente']}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const badge=(s)=>`<span class="badge ${['Crítica','Alta'].includes(s)?'red':['Resuelto','Cerrado','Cumplido'].includes(s)?'green':s==='Pendiente'?'amber':''}">${esc(s)}</span>`;const title=(name,sub)=>`<div class="row"><div><div class="eyebrow">SERVICE OPERATIONS / MÉXICO</div><h1>${name}</h1><div class="subtitle">${sub}</div></div><button class="btn primary" data-new>＋ Nuevo ticket</button></div>`;function table(){const data=tickets.filter(t=>(filter==='Todos'||t.status===filter)&&(t.title+' '+t.client+' '+t.branch+' '+t.id).toLowerCase().includes(search.toLowerCase()));return `<table><thead><tr><th>TICKET / SUCURSAL</th><th>PRIORIDAD</th><th>RESPONSABLE</th><th>ESTADO / SLA</th></tr></thead><tbody>${data.map(t=>`<tr><td><button class="ticket-title" data-ticket="${t.id}"><span class="ticket-id">MX-${t.id}</span>${esc(t.title)}</button><small>${esc(t.client)} · ${esc(t.branch)}</small></td><td>${badge(t.priority)}</td><td>${esc(t.agent)}<small>${esc(t.channel)}</small></td><td>${badge(t.status)}<small>${esc(t.sla)}</small></td></tr>`).join('')||'<tr><td colspan="4">Sin tickets para esta búsqueda.</td></tr>'}</tbody></table>`}function aiPanel(){return `<div class="panel ai"><div class="ai-head"><div class="orb">✦</div><div><b>Olivia IA <span style="font-size:8px;color:#7c8f65">v3.6</span></b><div class="muted">Tu copiloto de atención</div></div></div><div class="insight-label">FOCO RECOMENDADO</div><h3>Una sucursal necesita<br>tu atención.</h3><p>La terminal de cobro de Benavides está sin conexión. Revisa el caso y prepara el siguiente paso.</p><button class="btn primary" data-ticket="1048">Resolver con Olivia &nbsp; ↗</button><span class="ai-footer">Sugerencia ilustrativa · Tú tienes el control</span></div>`}
function ticketBoard(){const groups=[['Por atender',['Abierto','Pendiente']],['En proceso',['En proceso']],['Completados',['Resuelto','Cerrado']]];return `<div class="kanban">${groups.map(([name,states])=>{const rows=tickets.filter(t=>states.includes(t.status)&&(filter==='Todos'||filter===t.status)&&(t.title+' '+t.client+' '+t.branch+' '+t.id).toLowerCase().includes(search.toLowerCase()));return `<div class="kanban-col"><div class="kanban-head">${name} <span style="float:right">${rows.length.toString().padStart(2,'0')}</span></div>${rows.map(t=>`<div class="ticket-card"><div class="row"><span class="ticket-id">MX-${t.id}</span>${badge(t.priority)}</div><button class="ticket-title" data-ticket="${t.id}">${esc(t.title)}</button><p>${esc(t.client)}<br>${esc(t.branch)}</p><div class="card-bottom"><span class="avatar">${t.agent.split(' ').map(n=>n[0]).join('')}</span><span>${esc(t.sla)}</span></div></div>`).join('')||'<p class="notice">Sin casos en esta etapa.</p>'}</div>`}).join('')}</div>`}
function render(){root.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const count=q('.nav-count');if(count)count.textContent=String(tickets.length).padStart(2,'0');if(view==='overview'){content.innerHTML=title('El servicio, en sincronía.','Cada conversación importa. Cada caso tiene un siguiente paso.')+`<div class="hero"><div class="hero-copy"><div class="eyebrow"><span class="live-dot"></span> OLIVIA INTELLIGENCE · V3.6</div><h2>Tu operación, conectada.<br>Tu equipo, <em>un paso adelante.</em></h2><p>Contexto, seguimiento y respuestas asistidas en un mismo lugar.</p><button class="btn lime" data-view="olivia">Abrir mi briefing &nbsp; ↗</button></div><div class="hero-art" aria-hidden="true"><div class="hero-orbit"></div><div class="orb">✦</div><div class="orbit-tag">✦ &nbsp; Claridad para actuar</div></div></div><div class="stats"><div class="stat"><small>Tickets activos</small><strong>${String(tickets.filter(t=>!['Cerrado','Resuelto'].includes(t.status)).length).padStart(2,'0')}<span class="trend">↗ En seguimiento</span></strong><footer>En la muestra de demostración</footer></div><div class="stat"><small>Atención prioritaria</small><strong>${String(tickets.filter(t=>t.priority==='Crítica'&&!['Cerrado','Resuelto'].includes(t.status)).length).padStart(2,'0')}</strong><footer><span style="color:#b17a59">●</span> Impacto en operación</footer></div><div class="stat"><small>Resueltos / cerrados</small><strong>${String(tickets.filter(t=>['Cerrado','Resuelto'].includes(t.status)).length).padStart(2,'0')}</strong><footer>Casos de esta muestra</footer></div><div class="stat"><small>Cuentas conectadas</small><strong>02</strong><footer>Benavides & Martí</footer></div></div><div class="columns"><div><div class="panel"><div class="panel-head"><div><h2>En el radar</h2><div class="subtitle" style="margin-top:5px">La siguiente acción empieza aquí.</div></div><button class="small-link" data-view="tickets">Ver todos ↗</button></div><div class="table-wrap">${table()}</div><div class="table-foot"><span>${tickets.length} casos · Muestra de operación</span><span>01 / 01</span></div></div><div class="panel chart-panel"><div class="panel-head"><h2>Pulso de atención</h2><div class="chart-legend"><span>Recibidos</span><span>Resueltos</span></div></div><svg class="chart" viewBox="0 0 500 140" preserveAspectRatio="none" role="img" aria-label="Serie semanal simulada: recibidos 38, 51, 44, 65, 58; resueltos 32, 45, 41, 54, 55"><defs><linearGradient id="mx-chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b9d394" stop-opacity=".4"/><stop offset="100%" stop-color="#b9d394" stop-opacity="0"/></linearGradient></defs><g stroke="#edf0e8"><path d="M25 20H490M25 55H490M25 90H490M25 125H490"/></g><g fill="#a1ab94" font-size="9"><text x="0" y="24">70</text><text x="0" y="59">50</text><text x="0" y="94">30</text></g><path d="M25 76L140 53L255 65L370 29L490 41V125H25Z" fill="url(#mx-chart-fill)"/><path d="M25 87L140 64L255 71L370 48L490 46" fill="none" stroke="#d4dfc5" stroke-width="2"/><path d="M25 76L140 53L255 65L370 29L490 41" fill="none" stroke="#8dad5e" stroke-width="2"/><circle cx="490" cy="41" r="4" fill="#759b43"/></svg><div class="chart-labels"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span></div><div class="notice" style="margin-top:14px">Volumen semanal ilustrativo · Número de tickets</div></div></div><div class="secondary-column">${aiPanel()}<div class="panel" style="margin-top:17px"><h2>Una sola conversación.</h2><p class="subtitle" style="margin-bottom:5px">Todos tus canales, una misma operación.</p>${[['☎','Teléfono','Captura asistida',55],['✉','Email','Bandeja unificada',78],['◌','WhatsApp','Atención directa',65],['▦','Portal','Autoservicio',35]].map(a=>`<div class="queue"><div class="channel"><span class="channel-symbol">${a[0]}</span><div><b>${a[1]}</b><div class="muted" style="font-size:9px;margin-top:3px">${a[2]}</div></div></div><span style="color:#a1ae94">↗</span></div>`).join('')}<div class="notice" style="margin-top:10px">Canales propuestos · Sin conexión real</div></div></div></div>`}if(view==='tickets')content.innerHTML=title('Cada caso tiene su lugar.','De la primera conversación al cierre. Sin perder el contexto.')+`<div class="row"><div class="tabs">${['Todos','Abierto','En proceso','Pendiente','Resuelto','Cerrado'].map(s=>`<button class="${s===filter?'selected':''}" data-filter="${s}">${s}</button>`).join('')}</div><div class="mode-switch"><button class="btn ${board?'':'primary'}" data-mode="list">▤ Lista</button><button class="btn ${board?'primary':''}" data-mode="board">▦ Tablero</button></div></div><div class="toolbar"><input id="mx-search" aria-label="Buscar tickets" placeholder="⌕  Buscar por ticket, cliente o sucursal…" value="${esc(search)}"><button class="btn" data-export>↓ Exportar</button></div><div id="mx-table" class="${board?'':'panel'}">${board?ticketBoard():table()}</div>`;if(view==='clients')content.innerHTML=title('Grandes redes. Atención cercana.','Una visión de cada cliente, hasta el último punto de servicio.')+`<div class="client-grid" style="margin-top:25px">${['Farmacias Benavides','Martí'].map((c,i)=>`<div class="panel"><div class="client-banner" style="background:${i?'#edf1e7':'#f6efea'}"><div class="big-client" style="color:${i?'#3c543b':'#a36550'}">${c}</div><small>${i?'RETAIL & DEPORTE':'SALUD & BIENESTAR'}</small></div><div class="row"><span class="badge green">Cuenta de demostración</span><span class="muted" style="font-size:10px">México</span></div><p class="subtitle">${i?'Atención a una red de tiendas deportivas.':'~1,500 sucursales según el brief de Omar.'}</p><div class="queue"><span>Tickets de la muestra</span><b>${tickets.filter(t=>t.client===c).length.toString().padStart(2,'0')}</b></div>${tickets.filter(t=>t.client===c).map(t=>`<div class="queue"><button class="ticket-title" data-ticket="${t.id}">${esc(t.branch)}<span class="ticket-id" style="margin-top:5px">MX-${t.id}</span></button>${badge(t.status)}</div>`).join('')}</div>`).join('')}</div>`;if(view==='team')content.innerHTML=title('Un equipo. El mismo ritmo.','La persona correcta, en el momento que el cliente la necesita.')+`<div class="columns" style="margin-top:25px"><div class="panel"><div class="panel-head"><h2>Tu equipo de atención</h2><span class="badge green">3 agentes · Demo</span></div>${['Ana López','Carlos Ruiz','Laura Méndez'].map((n,i)=>`<div class="agent"><div class="avatar" style="background:${['#e8efdd','#ede7db','#e0e9df'][i]}">${n.split(' ').map(x=>x[0]).join('')}</div><div><b>${n}</b><div class="muted">${['Soporte de primera línea','Soporte técnico','Atención al cliente'][i]} · ${tickets.filter(t=>t.agent===n&&!['Cerrado','Resuelto'].includes(t.status)).length} casos activos</div></div>${badge('Disponible')}</div>`).join('')}<div class="reply" style="margin-top:25px"><b>Asignación con contexto</b><p>Abre un ticket para cambiar el responsable. El nuevo agente conserva el historial completo del caso.</p><button class="btn" data-view="tickets">Ir a la mesa de tickets ↗</button></div></div><div class="panel"><div class="eyebrow" style="margin-bottom:10px">COMPROMISOS DE SERVICIO</div><h2>El tiempo también cuenta.</h2><p class="subtitle">Primera respuesta · Política propuesta</p>${[['Crítica','30 min'],['Alta','2 horas'],['Media','8 horas'],['Baja','24 horas']].map(a=>`<div class="queue">${badge(a[0])}<b>${a[1]}</b></div>`).join('')}<p class="notice">Objetivos ilustrativos, pendientes de validar por cliente y horario de operación.</p></div></div>`;if(view==='olivia')content.innerHTML=`<div class="row"><div><div class="eyebrow">INTELLIGENCE WORKSPACE</div><h1>Conoce a tu mejor copiloto.</h1><div class="subtitle">Olivia IA v3.6 · Contexto para decidir. Claridad para responder.</div></div><span class="badge green">Asistente de demostración</span></div><div class="olivia-stage"><div class="orb">✦</div><div class="eyebrow" style="margin-bottom:13px">OLIVIA IA · V3.6</div><h2>Menos ruido.<br>Más claridad para actuar.</h2><p>Preparo el contexto, organizo las prioridades y te ayudo a responder. Tú decides el siguiente paso.</p><div class="prompt-chips"><button data-brief="priorities">✦ Qué necesita mi atención</button><button data-brief="summary">▤ Resumir mi operación</button><button data-ticket="1048">↗ Preparar una respuesta</button></div><div id="mx-brief" class="ai-brief" hidden aria-live="polite"></div></div><div class="panel" style="margin-top:20px"><div class="panel-head"><h2>Continúa con un caso</h2><span class="muted" style="font-size:9px">CONTEXT-AWARE SUPPORT</span></div>${tickets.slice(0,4).map(t=>`<div class="queue"><button class="ticket-title" data-ticket="${t.id}"><span class="ticket-id">MX-${t.id} · ${esc(t.client)}</span>${esc(t.title)}</button>${badge(t.priority)}</div>`).join('')}</div><p class="notice">Respuestas predefinidas para explorar el concepto. Sin conexión al servicio Olivia ni envío de mensajes.</p>`;content.insertAdjacentHTML('beforeend','<div class="notice" style="display:flex;justify-content:space-between;gap:10px"><span>MAXCESS SERVICE INTELLIGENCE · Concepto O7 Digital</span><span>Datos simulados</span></div>')}
function toast(s){q('#mx-toast').textContent=s;q('#mx-toast').hidden=false;setTimeout(()=>q('#mx-toast').hidden=true,3500)}function close(){q('#mx-overlay').hidden=true;q('#mx-overlay').innerHTML=''}function modal(html){q('#mx-overlay').hidden=false;q('#mx-overlay').innerHTML=`<div class="overlay"><div class="dialog">${html}</div></div>`}function openTicket(id){const t=tickets.find(t=>t.id===id);modal(`<div class="row"><div><span class="muted">TICKET #${t.id} / ${esc(t.client)}</span><h2 style="margin-top:8px">${esc(t.title)}</h2></div><button class="btn" data-close aria-label="Cerrar detalle">×</button></div><div class="dialog-grid"><div class="panel"><span class="muted">${esc(t.branch)} · ${esc(t.channel)}</span><p>${esc(t.desc)}</p><div class="timeline">${t.history.map(h=>`<p>${esc(h)}</p>`).join('')}</div><label for="mx-reply">Respuesta o nota de resolución</label><textarea id="mx-reply" rows="4" placeholder="Escribe una respuesta…"></textarea><div class="row" style="margin-top:10px"><button class="btn" data-note="${id}">Guardar nota</button><button class="btn primary" data-resolve="${id}">${t.status==='Resuelto'?'Cerrar ticket':t.status==='Cerrado'?'Reabrir ticket':'Resolver ticket'}</button></div><div id="mx-error" role="alert" style="color:#bc4945;margin-top:8px"></div></div><div><div class="panel"><label for="mx-agent">Responsable</label><select id="mx-agent" data-agent="${id}">${['Ana López','Carlos Ruiz','Laura Méndez'].map(a=>`<option ${a===t.agent?'selected':''}>${a}</option>`).join('')}</select><label>Estado actual</label>${badge(t.status)}<label>Prioridad · primera respuesta</label>${badge(t.priority)} <span style="font-size:12px">${t.sla}</span></div><div class="panel ai" style="margin-top:14px"><b>✦ Olivia IA v3.6</b><p style="font-size:12px">Contexto del caso listo para revisión.</p><button class="btn" data-summary="${id}">Resumir caso</button><button class="btn primary" data-draft="${id}">Preparar respuesta</button><button class="btn" data-priority="${id}">Sugerir prioridad</button><div id="mx-ai-result" aria-live="polite" style="margin-top:12px;font-size:12px;line-height:1.6"></div></div></div></div>`)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){board=b.dataset.mode==='board';render()}if(b.dataset.brief){const el=q('#mx-brief');el.hidden=false;el.innerHTML=b.dataset.brief==='summary'?`<b>Tu operación en un vistazo.</b><p>${tickets.length} tickets en la muestra. ${tickets.filter(t=>!['Cerrado','Resuelto'].includes(t.status)).length} siguen activos y ${tickets.filter(t=>['Cerrado','Resuelto'].includes(t.status)).length} están resueltos o cerrados. La atención se distribuye entre Benavides y Martí.</p><span class="muted">Resumen calculado con los casos de esta demo.</span>`:`<b>Comienza por el impacto operativo.</b><p>Revisa los casos críticos activos: ${tickets.filter(t=>t.priority==='Crítica'&&!['Cerrado','Resuelto'].includes(t.status)).map(t=>'#'+t.id+' · '+esc(t.title)).join('; ')||'No hay casos críticos activos.'}</p><button class="btn primary" data-view="tickets">Abrir la cola de atención ↗</button>`}if(b.dataset.view){view=b.dataset.view;filter='Todos';search='';render()}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.hasAttribute('data-close'))close();if(b.dataset.ticket)openTicket(Number(b.dataset.ticket));if(b.hasAttribute('data-new'))modal(`<div class="row"><h2>Registrar nuevo ticket</h2><button class="btn" data-close>×</button></div><form id="mx-new-form"><label for="mx-subject">Asunto</label><input id="mx-subject" name="subject" required maxlength="120" placeholder="Describe la incidencia"><label for="mx-client">Cliente</label><select id="mx-client" name="client"><option>Farmacias Benavides</option><option>Martí</option></select><label for="mx-branch">Sucursal</label><input id="mx-branch" name="branch" required placeholder="Ciudad y número de sucursal"><label for="mx-desc">Descripción</label><textarea id="mx-desc" name="desc" required rows="3"></textarea><div class="client-grid"><div><label for="mx-priority">Prioridad</label><select id="mx-priority" name="priority"><option>Media</option><option>Crítica</option><option>Alta</option><option>Baja</option></select></div><div><label for="mx-channel">Canal</label><select id="mx-channel" name="channel"><option>Teléfono</option><option>Email</option><option>WhatsApp</option><option>Portal</option></select></div></div><button class="btn primary" type="submit" style="margin-top:20px">Crear ticket</button></form>`);for(const key of ['summary','draft','priority','note','resolve'])if(b.dataset[key]){const t=tickets.find(t=>t.id===Number(b.dataset[key]));if(key==='summary')q('#mx-ai-result').textContent=`${t.client}, ${t.branch}: ${t.desc} Responsable: ${t.agent}. Estado: ${t.status}. Siguiente paso: ${t.status==='Pendiente'?'obtener información faltante del cliente':'validar diagnóstico y comunicar avance'}.`;if(key==='draft'){q('#mx-reply').value=`Hola, hemos registrado tu incidencia #${t.id} para ${t.branch}. ${t.agent} dará seguimiento a tu solicitud. Por favor confirma desde cuándo ocurre el problema y comparte el mensaje de error, si existe. Te informaremos aquí sobre el avance. Gracias.`;q('#mx-ai-result').textContent='Borrador preparado. Revisa y ajusta antes de usarlo. No se envía al cliente.'}if(key==='priority')q('#mx-ai-result').textContent=`Prioridad sugerida: ${t.priority}. ${t.priority==='Crítica'?'El incidente impide una operación esencial de la sucursal.':'Se conserva la clasificación de este ejemplo.'} La sugerencia no cambia el ticket.`;if(['note','resolve'].includes(key)){const note=q('#mx-reply').value.trim();if(!note&&t.status!=='Cerrado'){q('#mx-error').textContent='Añade una nota antes de guardar o cambiar el estado.';return}if(note)t.history.push('Ahora · Nota del agente: '+note);if(key==='resolve')t.status=t.status==='Resuelto'?'Cerrado':t.status==='Cerrado'?'Abierto':'Resuelto';close();render();toast(key==='note'?'Nota guardada en la demo.':'Estado actualizado: '+t.status)}}if(b.hasAttribute('data-export')){const csv='ID,Asunto,Cliente,Sucursal,Prioridad,Estado,Responsable\n'+tickets.map(t=>[t.id,t.title,t.client,t.branch,t.priority,t.status,t.agent].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='maxcess-tickets-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});root.addEventListener('input',e=>{if(e.target.id==='mx-search'){search=e.target.value;q('#mx-table').innerHTML=board?ticketBoard():table()}});root.addEventListener('change',e=>{if(e.target.dataset.agent){tickets.find(t=>t.id===Number(e.target.dataset.agent)).agent=e.target.value;render();toast('Responsable actualizado en la demo.')}});root.addEventListener('submit',e=>{if(e.target.id!=='mx-new-form')return;e.preventDefault();const f=new FormData(e.target),t={id:Math.max(...tickets.map(t=>t.id))+1,title:f.get('subject'),client:f.get('client'),branch:f.get('branch'),desc:f.get('desc'),priority:f.get('priority'),channel:f.get('channel'),status:'Abierto',agent:'Ana López',sla:'Por iniciar',history:['Ahora · Ticket registrado en la demo']};tickets.unshift(t);close();view='tickets';filter='Todos';search='';render();toast('Ticket #'+t.id+' creado.');});root.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render()})();
</script>
</div>

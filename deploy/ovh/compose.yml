name: maxcess
services:
  postgres:
    image: postgres:18-alpine
    container_name: maxcess-postgres
    restart: unless-stopped
    env_file: /opt/o7/apps/maxcess/postgres.env
    command: [postgres, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, max_connections=40]
    volumes:
      - /mnt/maildata/maxcess/postgres:/var/lib/postgresql
    networks: [database]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: maxcess-api:ovh-20261021
    container_name: maxcess-api
    restart: unless-stopped
    env_file: /opt/o7/apps/maxcess/app.env
    depends_on:
      postgres: {condition: service_healthy}
    ports: ['127.0.0.1:8105:3000']
    networks:
      database: {}
      applications: {aliases: [maxcess-api]}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  database: {internal: true}
  applications: {external: true, name: o7-apps}

# Inside the existing o7-proxy default server. Public TLS is already terminated upstream.
location ^~ /servicehub-backend/ {
    set $maxcess_backend http://maxcess-api:3000;
    rewrite ^/servicehub-backend/(.*)$ /$1 break;
    proxy_pass $maxcess_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    # X-Real-IP is overwritten by the existing trusted TLS edge.
    proxy_set_header X-Forwarded-For $http_x_real_ip;
    proxy_read_timeout 60s;
    client_max_body_size 3m;
    add_header X-Maxcess-Backend ovh-vps1 always;
}
